name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      java_version: "21"
      run_tests: true

  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  pr-comment:
    runs-on: ubuntu-latest
    needs: [build-test, dependency-review]
    permissions:
      contents: read
    steps:
      - name: Print PR Summary
        run: |
          echo "PR checks passed for branch: ${{ github.head_ref }}"
