name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      java_version: "21"
      run_tests: true

  dependency-review:
    name: Dependency Vulnerability Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Dependencies for Vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  pr-comment:
    runs-on: ubuntu-latest
    needs:
      - build-test
      - dependency-review

    steps:
      - name: Print PR Summary
        run: |
          echo "PR checks passed for branch: ${{ github.head_ref }}"
